services:
  backend:
    build: ./backend
    environment:
      APP_MODE: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentic_intelligence}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentic_intelligence}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      ARTIFACT_STORAGE_PATH: /app/var/artifacts
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      ORCHESTRATOR_PROVIDER: ${ORCHESTRATOR_PROVIDER:-openai}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-https://api.openai.com/v1}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-gpt-6-astra}
      ORCHESTRATOR_TIMEOUT_SECONDS: ${ORCHESTRATOR_TIMEOUT_SECONDS:-30}
      ORCHESTRATOR_MAX_RETRIES: ${ORCHESTRATOR_MAX_RETRIES:-2}
      ORCHESTRATOR_MAX_OUTPUT_TOKENS: ${ORCHESTRATOR_MAX_OUTPUT_TOKENS:-3000}
      ORCHESTRATOR_CONTEXT_TOKENS: ${ORCHESTRATOR_CONTEXT_TOKENS:-8192}
      ORCHESTRATOR_INPUT_COST_PER_MILLION: ${ORCHESTRATOR_INPUT_COST_PER_MILLION:-}
      ORCHESTRATOR_OUTPUT_COST_PER_MILLION: ${ORCHESTRATOR_OUTPUT_COST_PER_MILLION:-}
      PDF_MAX_UPLOAD_BYTES: ${PDF_MAX_UPLOAD_BYTES:-20971520}
      RETRIEVAL_CHUNK_SIZE: ${RETRIEVAL_CHUNK_SIZE:-1200}
      RETRIEVAL_CHUNK_OVERLAP: ${RETRIEVAL_CHUNK_OVERLAP:-200}
      ALLOW_PRIVATE_REST_TARGETS: ${ALLOW_PRIVATE_REST_TARGETS:-0}
      EXTERNAL_PG_PASSWORD: ${EXTERNAL_PG_PASSWORD:-}
      REST_BEARER_TOKEN: ${REST_BEARER_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    volumes:
      - artifact_data:/app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentic_intelligence}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentic_intelligence}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_intelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
  artifact_data:
