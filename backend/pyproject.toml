[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-intelligence-backend"
version = "0.1.0"
description = "Backend foundation for Agentic Intelligence Workspace"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "openai>=2,<3",
    "pandas>=2.2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "pyarrow>=17,<23",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
aws = [
    "mangum>=0.19,<1",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
retrieval-eval = "app.evaluation.retrieval:main"
product-eval = "app.evaluation.product:main"
agent-eval = "app.evaluation.agent:main"
model-eval = "app.evaluation.model_quality:main"
template-transform-eval = "app.evaluation.template_transform:main"
sources-eval = "app.evaluation.sources:main"
analytics-eval = "app.evaluation.analytics:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
