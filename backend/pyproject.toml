[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-intelligence-backend"
version = "0.1.0"
description = "Backend foundation for Agentic Intelligence Workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "openai>=2,<3",
    "pandas>=2.2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
retrieval-eval = "app.evaluation.retrieval:main"
product-eval = "app.evaluation.product:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
