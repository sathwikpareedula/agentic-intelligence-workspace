name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentic_intelligence_test
          POSTGRES_USER: agentic_intelligence_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_intelligence_test -d agentic_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --ignore=tests/test_postgres_integration.py
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://agentic_intelligence_test:ci-only-password@localhost:5432/agentic_intelligence_test
      - run: python -m pytest -q tests/test_postgres_integration.py
        env:
          ALLOW_DATABASE_INTEGRATION_TESTS: "1"
          TEST_DATABASE_URL: postgresql://agentic_intelligence_test:ci-only-password@localhost:5432/agentic_intelligence_test
      - run: python -m app.evaluation.retrieval ../evals/retrieval_cases.json
      - run: python -m app.evaluation.product ../evals/product_cases.json
      - run: python -m app.evaluation.agent ../evals/agent_cases.json
      - run: python -m app.evaluation.north_star ../evals/north_star_cases.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
